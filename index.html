<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Manifest Bird - Frekansını Koru</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: #1a0b2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 360px;
            height: 640px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 16px;
            overflow: hidden;
            background: #2b1055;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: manipulation;
        }

        /* Skor Göstergesi */
        #score-display {
            position: absolute;
            top: 25px;
            width: 100%;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #ff77e9;
            text-shadow: 0 2px 10px rgba(255, 119, 233, 0.6);
            pointer-events: none;
            z-index: 10;
        }

        /* Game Over Paneli */
        #game-over-panel {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 11, 46, 0.92);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 20;
        }

        #final-score {
            font-size: 26px;
            font-weight: bold;
            color: #ffe6ff;
            margin-bottom: 12px;
        }

        #manifest-quote {
            font-size: 16px;
            color: #d1b3ff;
            font-style: italic;
            line-height: 1.5;
            min-height: 50px;
            margin-bottom: 30px;
        }

        #restart-btn {
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        #restart-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(217, 70, 239, 0.6);
        }

        /* Karakter Seçim Ekranı */
        #char-select-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, #2b1055, #1a0b2e 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            z-index: 30;
        }

        #char-select-title {
            font-size: 24px;
            font-weight: 800;
            color: #ff77e9;
            text-shadow: 0 2px 10px rgba(255, 119, 233, 0.6);
            margin-bottom: 6px;
        }

        #char-select-subtitle {
            font-size: 13px;
            color: #d1b3ff;
            margin-bottom: 28px;
        }

        #char-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 300px;
            margin-bottom: 30px;
        }

        .char-option {
            width: 100px;
            border: none;
            background: transparent;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .char-option .char-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            overflow: hidden;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
        }

        .char-option img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .char-option .char-name {
            font-size: 13px;
            font-weight: 700;
            color: #d1b3ff;
            transition: color 0.15s;
        }

        .char-option:hover .char-avatar {
            transform: scale(1.05);
        }

        .char-option.selected .char-avatar {
            border-color: #d946ef;
            box-shadow: 0 0 0 3px rgba(217, 70, 239, 0.4), 0 4px 15px rgba(217, 70, 239, 0.5);
            transform: scale(1.08);
        }

        .char-option.selected .char-name {
            color: #ff77e9;
        }

        #start-btn {
            background: linear-gradient(135deg, #d946ef, #8b5cf6);
            color: white;
            border: none;
            padding: 14px 34px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.4);
            transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        #start-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="char-select-screen">
            <div id="char-select-title">Karakterini Seç</div>
            <div id="char-select-subtitle">Bugün Hangi Kızsın?</div>
            <div id="char-grid"></div>
            <button id="start-btn" disabled onclick="startGameFromSelect()">Go Girl!</button>
        </div>

        <div id="score-display">0 </div>
        <canvas id="gameCanvas" width="360" height="640"></canvas>
        <audio id="bg-music" loop>
            <source src="manifest-song.mp3" type="audio/mpeg">
        </audio>

        <div id="game-over-panel">
            <div id="final-score">Skor: 0 </div>
            <div id="manifest-quote">"Evren sana bir mesaj iletmek istiyor..."</div>
            <button id="restart-btn" onclick="backToCharSelect()">Go Girl!</button>
        </div>
    </div>

        let selectedCharacterId = null;

        // Kafa görseli ekleme alanı
        const playerImage = new Image();
        let hasImage = false;
        playerImage.onload = () => { hasImage = true; };

        function loadCharacterImage(src) {
            hasImage = false;
            playerImage.src = src;
        }

        // Karakter Seçim Ekranını Oluştur
        const charGrid = document.getElementById("char-grid");
        const startBtn = document.getElementById("start-btn");
        const charSelectScreen = document.getElementById("char-select-screen");

        function buildCharGrid() {
            charGrid.innerHTML = "";
            characters.forEach((char) => {
                const btn = document.createElement("button");
                btn.className = "char-option";
                btn.setAttribute("data-id", char.id);
                if (char.id === selectedCharacterId) btn.classList.add("selected");

                const avatar = document.createElement("div");
                avatar.className = "char-avatar";
                const img = document.createElement("img");
                img.src = char.src;
                img.alt = char.name;
                avatar.appendChild(img);

                const nameLabel = document.createElement("div");
                nameLabel.className = "char-name";
                nameLabel.textContent = char.name;

                btn.appendChild(avatar);
                btn.appendChild(nameLabel);

                btn.addEventListener("click", () => {
                    document.querySelectorAll(".char-option").forEach(el => el.classList.remove("selected"));
                    btn.classList.add("selected");
                    selectedCharacterId = char.id;
                    startBtn.disabled = false;
                });
                charGrid.appendChild(btn);
            });
        }

        buildCharGrid();

        function startGameFromSelect() {
            if (!selectedCharacterId) return;
            const char = characters.find(c => c.id === selectedCharacterId);
            loadCharacterImage(char.src);
            charSelectScreen.style.display = "none";
            resetGame();
            bgMusic.currentTime = 0;
            bgMusic.play().catch(() => {});
        }


        // Oyun Değişkenleri (Daha da Yavaşlatılmış Akış)
        let pipes = [];
        let score = 0;
        let isGameOver = true; // Karakter seçilene kadar oyun başlamaz
        let pipeTimer = 0;
        const pipeInterval = 165; // Engeller arası mesafe daha da açıldı (140 -> 165)
        const pipeSpeed = 1.15;   // Hız iyice düşürüldü (1.6 -> 1.15)
        const pipeGap = 185;      // Geçiş boşluğu biraz daha ferahlatıldı (175 -> 185)
        const pipeWidth = 52;

        function jump() {
            if (isGameOver) return;
            bird.velocity = bird.jump;
        }

        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") jump();
        });
        canvas.addEventListener("pointerdown", () => jump());

        function createPipe() {
            const minHeight = 70;
            const maxHeight = canvas.height - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                topHeight: topHeight,
                bottomY: topHeight + pipeGap,
                passed: false
            });
        }

        function update() {
            if (isGameOver) return;

            // Fizik
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, (bird.velocity * 3.5) * Math.PI / 180));

            // Zemin ve Tavan Kontrolü
            if (bird.y + bird.radius >= canvas.height || bird.y - bird.radius <= 0) {
                triggerGameOver();
            }

            pipeTimer++;
            if (pipeTimer >= pipeInterval) {
                createPipe();
                pipeTimer = 0;
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                const p = pipes[i];
                p.x -= pipeSpeed;

                // Skor
                if (!p.passed && p.x + pipeWidth < bird.x) {
                    p.passed = true;
                    score++;
                    scoreDisplay.innerText = score;
                }

                // Çarpışma Tespiti
                const checkCollision = (rectX, rectY, rectW, rectH) => {
                    const closestX = Math.max(rectX, Math.min(bird.x, rectX + rectW));
                    const closestY = Math.max(rectY, Math.min(bird.y, rectY + rectH));
                    const distanceX = bird.x - closestX;
                    const distanceY = bird.y - closestY;
                    return (distanceX * distanceX + distanceY * distanceY) < ((bird.radius - 2) * (bird.radius - 2));
                };

                if (checkCollision(p.x, 0, pipeWidth, p.topHeight) || 
                    checkCollision(p.x, p.bottomY, pipeWidth, canvas.height - p.bottomY)) {
                    triggerGameOver();
                }

                if (p.x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#2b1055";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sütunlar
            for (let p of pipes) {
                ctx.fillStyle = "#7c3aed";
                ctx.fillRect(p.x, 0, pipeWidth, p.topHeight);
                ctx.fillRect(p.x, p.bottomY, pipeWidth, canvas.height - p.bottomY);

                ctx.strokeStyle = "#a78bfa";
                ctx.lineWidth = 3;
                ctx.strokeRect(p.x, 0, pipeWidth, p.topHeight);
                ctx.strokeRect(p.x, p.bottomY, pipeWidth, canvas.height - p.bottomY);
            }

            // Karakter
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation);

            if (hasImage) {
                const drawSize = bird.radius * 2.6; // görsel çarpışma kutusundan biraz büyük çizilir
                ctx.drawImage(playerImage, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ff77e9";
                ctx.shadowColor = "#ff77e9";
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function triggerGameOver() {
            if (isGameOver) return;
            isGameOver = true;

            bgMusic.pause();
            bgMusic.currentTime = 0;

            gameOverPanel.style.display = "flex";
            finalScoreText.innerText = "Skor: " + score;
            manifestQuoteText.innerText = quotes[Math.floor(Math.random() * quotes.length)];
        }

        function resetGame() {
            bird.y = 280;
            bird.velocity = 0;
            bird.rotation = 0;
            pipes = [];
            score = 0;
            pipeTimer = 0;
            scoreDisplay.innerText = "0";
            gameOverPanel.style.display = "none";
            isGameOver = false;
        }

        function backToCharSelect() {
            gameOverPanel.style.display = "none";
            isGameOver = true;
            bgMusic.pause();
            bgMusic.currentTime = 0;
            pipes = [];
            score = 0;
            scoreDisplay.innerText = "0";
            buildCharGrid();
            startBtn.disabled = !selectedCharacterId;
            charSelectScreen.style.display = "flex";
        }

        loop();

        // Ekrana sığdırmak için oyunu gerçek piksel boyutuyla küçült (transform kullanmadan, performans için)
        const gameContainer = document.getElementById("game-container");
        function fitToScreen() {
            const scale = Math.min(
                window.innerWidth / 360,
                window.innerHeight / 640,
                1
            );
            const newWidth = Math.floor(360 * scale);
            const newHeight = Math.floor(640 * scale);
            gameContainer.style.width = newWidth + "px";
            gameContainer.style.height = newHeight + "px";
        }
        window.addEventListener("resize", fitToScreen);
        window.addEventListener("orientationchange", fitToScreen);
        fitToScreen();
    </script>
</body>
</html>
